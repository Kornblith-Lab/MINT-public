global:
  min_token_count: 25
  min_encounter_tokens: 12
  # max_encounter_minutes: 28765  # Uncomment to drop encounters longer than this (minutes)
  encounter_key_column: EncounterKey
  disposition_filter: [Discharge, Admit]
  numerical_strategy:
    mode: combined_exact  # combined_exact | combined_percentile | separate_exact | separate_percentile
    percentile_rounding: 5
    zscore_step: 0.2  # Step size for z-score discretization (clips to [-3,3])
  split:
    train: "year <= 2023"
    test: "year >= 2024"
  output_dir: "output"

sources:
  vitals:
    file: vitals.csv
    mode: keyed
    key_column: FlowsheetRowDisplayName
    value_column: NumericValue
    timestamp_column: TakenInstant
    defaults:
      type: numeric
      rounding: int
      prefix: Vital
    variables:
      BP: { type: custom, process: bp }
      Glasgow Coma Scale Score: { rounding: int }
      MAP (mmHg): { rounding: 5 }
      O2 Device: { type: custom, process: o2_device, value_column: Value }
      O2 Flow Rate (l/min): {  }
      Pulse: { rounding: 5 }
      "Pulse - Palpated/Pleth": { rounding: 5, rename: Pulse }
      Resp: { rounding: 2 }
      SpO2: { rounding: int }
      Temp: { rounding: int }
      Weight: { type: custom, process: weight_oz_to_kg }

  labs:
    file: labs.csv
    mode: keyed
    key_column: ComponentName
    value_column: Value
    timestamp_column: ResultInstant
    defaults:
      type: numeric
      rounding: exact  # Options: exact, int, intN, zscore
      # rounding: zscore  # Z-score mode: requires lab_zscore_stats.json in data-dir
      prefix: Lab
      numeric: false  # Set to true with rounding: zscore to use z-score tokens
      min_abnormal_fraction: 0.05  # In non-percentile modes, only include labs with >5% abnormal
      numeric_fallback:
        condition: { column: Abnormal, equals: 1 }
        suffix: "_Abnormal"
    variables:
      "% Basophils": {}
      "% Eosinophils": {}
      "% Immature Granulocytes": {}
      "% Lymphocytes": {}
