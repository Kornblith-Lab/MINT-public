    variables:
      ArrivalMethod: { prefix: "Arrival_Method" }
      PrimaryChiefComplaintName: { prefix: CC }
      Age: { prefix: Age, type: numeric, rounding: int }
      AcuityLevel: { prefix: Acuity }
      Sex: { prefix: Sex }
      EdDisposition:
        rules:
          - { value: Discharge, token_name: Discharge, timestamp_column: DepartureInstant }
          - { value: Admit, token_name: Admit, timestamp_column: DepartureInstant }

  icu:
    file: icu.csv
    mode: multi_column
    variables:
      FirstIcuStayStartInstant:
        token_name: "ICU Start"
